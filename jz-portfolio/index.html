<!DOCTYPE html>
<html lang="en" data-mode="dark" data-ink="neutral">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/jzoa-favico.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title, description, canonical and the OG / Twitter cards are not here.
         They are per-route and come from usePageMeta(), which vite-ssg writes
         into each prerendered page at build time. Duplicating them here would
         emit two of each. -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- same opt-out as the CSS, but in effect before the stylesheet lands -->
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      /* Theme before first paint. Reading localStorage in onMounted paints the
         wrong theme first and flashes; this runs blocking, ahead of #app, and
         useTheme.js then syncs with whatever it finds on <html>. */
      ;(function () {
        var PAPER = {
          neutral: { dark: '#0a0a0a', light: '#fbfbfa' },
          warm: { dark: '#0b0a08', light: '#faf7f2' },
          cool: { dark: '#08090b', light: '#f8fafb' },
        }
        var mode = 'dark'
        var ink = 'neutral'
        try {
          var saved = JSON.parse(localStorage.getItem('julia.theme.v2') || 'null')
          if (saved && PAPER[saved.ink] && PAPER[saved.ink][saved.mode]) {
            mode = saved.mode
            ink = saved.ink
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            mode = 'light'
          }
        } catch (e) {}
        var root = document.documentElement
        root.dataset.mode = mode
        root.dataset.ink = ink
        var meta = document.querySelector('meta[name=theme-color]')
        if (meta) meta.setAttribute('content', PAPER[ink][mode])

        /* Second visit in this session: the prerendered overlay is in the
           HTML, so hide it before paint rather than after hydration. Keep the
           key in sync with Preloader's storageKey prop. */
        try {
          if (sessionStorage.getItem('jz.preloader.v1'))
            root.classList.add('jz-intro-seen')
        } catch (e) {}
      })()
    </script>

    <!-- The page is prerendered, so its content is in the HTML whether or not
         JavaScript runs. But .reveal starts at opacity: 0 and is cleared by an
         IntersectionObserver, so without JS the text would be there and
         invisible. This turns the reveals off in that case. -->
    <noscript>
      <style>
        #jz-preloader { display: none !important; }
        .reveal,
        .reveal .chip,
        .reveal-hero > * {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Hidden form for Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
